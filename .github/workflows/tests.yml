name: Code and unit tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt ruff
      - run: python -m ruff check .
      - run: python -m pytest tests/test_text.py tests/test_v2.py tests/test_robustness.py tests/test_entity_context.py tests/test_evidence_context.py tests/test_narrative_context.py tests/test_material_context.py tests/test_evaluation.py tests/test_tuning.py tests/test_upgrade_v4.py tests/test_full_document.py -q
